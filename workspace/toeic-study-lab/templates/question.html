<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>TOEIC Study Lab</title>
</head>
<body>

<h1>TOEIC Study Lab</h1>

<p>
出題モード：{{ mode_label }}{% if grammar_point %}（{{ grammar_point }}）{% endif %}
</p>

{% if message %}
<p>{{ message }}</p>
{% elif question %}
<p><strong>{{ question[2] }}</strong></p>

<form action="/answer" method="post">

    <input type="hidden" name="question_id" value="{{ question[0] }}">
    <input type="hidden" name="mode" value="{{ mode }}">
    <input type="hidden" name="grammar_point" value="{{ grammar_point }}">

    <button type="submit" name="user_answer" value="A">
        A. {{ question[3] }}
    </button>

    <br><br>

    <button type="submit" name="user_answer" value="B">
        B. {{ question[4] }}
    </button>

    <br><br>

    <button type="submit" name="user_answer" value="C">
        C. {{ question[5] }}
    </button>

    <br><br>

    <button type="submit" name="user_answer" value="D">
        D. {{ question[6] }}
    </button>

</form>
{% else %}
<p>該当する問題がありません</p>
{% endif %}

<p><a href="/">ホームに戻る</a></p>
<p><a href="/history">履歴を見る</a></p>

</body>
</html>
